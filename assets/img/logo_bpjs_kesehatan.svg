<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <g transform="translate(10, 10)">
    <!-- Central Cross -->
    <g fill="#00a651">
      <path d="M 55 42 L 55 49 L 48 49 L 48 55 L 42 55 L 42 49 L 48 49 Z" fill="#00a651"/>
      <path d="M 55 61 L 55 68 L 61 68 L 61 61 L 68 61 L 68 55 L 61 55 Z" fill="#00a651"/>
      <path d="M 48 61 L 48 68 L 55 68 L 55 61 Z" fill="#00a651"/>
    </g>
    <!-- Circular Swirl Logo Elements -->
    <!-- Top-Right Curve (Green) -->
    <path d="M 55 10 C 72 10 87 20 95 35 C 92 37 88 38 84 37 C 78 26 67 18 55 18 C 45 18 36 24 31 32 C 28 30 25 28 22 27 C 29 17 41 10 55 10 Z" fill="#00a651"/>
    <circle cx="88" cy="22" r="7.5" fill="#00a651"/>
    
    <!-- Right-Bottom Curve (Dark Blue) -->
    <path d="M 95 45 C 99 53 100 61 99 70 C 97 68 94 67 90 68 C 91 62 90 56 87 50 C 85 45 81 40 76 37 C 78 34 80 31 82 28 C 88 32 93 38 95 45 Z" fill="#004b87"/>
    <circle cx="98" cy="78" r="7.5" fill="#004b87"/>
    
    <!-- Bottom-Left Curve (Deep Blue) -->
    <path d="M 85 88 C 76 97 64 102 51 101 C 52 98 52 94 50 91 C 60 92 70 88 77 81 C 82 76 85 70 86 63 C 89 63 93 64 96 66 C 94 74 90 82 85 88 Z" fill="#004b87"/>
    <circle cx="38" cy="98" r="7.5" fill="#0072bc"/>
    
    <!-- Left-Top Curve (Teal / Blue) -->
    <path d="M 23 80 C 14 70 10 57 12 44 C 15 45 19 46 22 44 C 21 54 25 64 32 71 C 37 76 43 80 50 82 C 49 85 49 89 50 92 C 39 90 30 86 23 80 Z" fill="#0072bc"/>
    <circle cx="15" cy="38" r="7.5" fill="#004b87"/>

    <!-- Inner Cross Arrows -->
    <g transform="translate(55,55)">
      <!-- Center stylized cross -->
      <path d="M -5 -16 L 5 -16 L 5 -5 L 16 -5 L 16 5 L 5 5 L 5 16 L -5 16 L -5 5 L -16 5 L -16 -5 L -5 -5 Z" fill="#00a651"/>
      <!-- Small white internal cutout -->
      <rect x="-2" y="-9" width="4" height="18" fill="#ffffff"/>
      <rect x="-9" y="-2" width="18" height="4" fill="#ffffff"/>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(130, 20)">
    <!-- BPJS -->
    <text x="0" y="48" font-family="'Arial Black', Arial, 'Segoe UI', sans-serif" font-weight="900" font-size="44" fill="#004b87" letter-spacing="-1">BPJS</text>
    <!-- Kesehatan -->
    <text x="125" y="48" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="44" fill="#00a651" letter-spacing="-0.5">Kesehatan</text>
    <!-- Subtitle -->
    <text x="2" y="76" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="16.5" fill="#004b87" letter-spacing="0.2">Badan Penyelenggara Jaminan Sosial</text>
  </g>
</svg>
